    <path d="M80 45 Q95 42 101 48 Q96 52 81 49 Z" fill="#666"/>
    <ellipse cx="52" cy="35" rx="4" ry="2.5" fill="#5f5a4e" opacity=".7"/>
    <!-- Uneven eyebrows -->
    <path d="M45 48 L55 50" stroke="#4a3b30" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M66 49 Q71 45 76 48" fill="none" stroke="#4a3b30" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Droopy, half-closed eyes -->
