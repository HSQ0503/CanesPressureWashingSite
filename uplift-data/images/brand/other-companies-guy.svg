    <!-- Wavy frown -->
    <path d="M52 74 Q60 68.5 68 73.5" fill="none" stroke="#5a3d2e" stroke-width="2" stroke-linecap="round"/>
    <!-- Stubble dots -->
    <g fill="#5a4a3d" opacity=".55">
      <circle cx="47" cy="70" r=".9"/><circle cx="50" cy="75" r=".9"/><circle cx="55" cy="77" r=".9"/>
      <circle cx="63" cy="77" r=".9"/><circle cx="68" cy="75" r=".9"/><circle cx="72" cy="70" r=".9"/>
