    <!-- Ears -->
    <circle cx="38" cy="58" r="5" fill="#c99f7c"/>
    <circle cx="82" cy="58" r="5" fill="#c99f7c"/>
    <!-- Head -->
    <ellipse cx="60" cy="57" rx="22" ry="24" fill="#d8ad88"/>
