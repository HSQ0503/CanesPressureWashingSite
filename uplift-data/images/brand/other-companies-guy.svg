<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Scruffy cartoon worker">
  <defs>
    <clipPath id="c"><circle cx="60" cy="60" r="60"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="120" height="120" fill="#3b3b3b"/>
    <!-- Slouched shoulders and dingy tank top with stains -->
    <path d="M12 120 Q16 92 40 86 L80 86 Q104 92 108 120 Z" fill="#c99f7c"/>
